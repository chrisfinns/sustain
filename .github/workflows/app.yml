name: App
# The macOS app: generate the project with XcodeGen, build, run unit tests.
on:
  push:
    paths:
      - "App/**"
      - "AppTests/**"
      - "project.yml"
      - "Packages/SustainCore/Sources/**"
      - "Packages/SustainCore/Package.swift"
      - ".github/workflows/app.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Generate project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sustain.xcodeproj \
            -scheme Sustain \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            | xcbeautify --renderer github-actions
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screens
          cp ~/Library/Containers/com.chrisfinns.sustain/Data/tmp/sustain-snapshots/*.png screens/ 2>/dev/null || true
          ls -la screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/
          if-no-files-found: ignore
      - name: Publish screenshots to the ci-screens branch
        # Overwritten on every push, so cloud sessions can fetch and compare them with the mockup.
        if: always() && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls screens/*.png >/dev/null 2>&1 || exit 0
          cd screens
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.png
          git commit -q -m "Screens for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screens
