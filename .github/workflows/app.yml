name: App
# The macOS app: generate the project with XcodeGen, build, run unit tests.
on:
  push:
    paths:
      - "App/**"
      - "AppTests/**"
      - "project.yml"
      - "Packages/SustainCore/Sources/**"
      - "Packages/SustainCore/Package.swift"
      - ".github/workflows/app.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          sw_vers
      - name: Generate project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Sustain.xcodeproj \
            -scheme Sustain \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            | xcbeautify --renderer github-actions
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p screens
          cp ~/Library/Containers/com.chrisfinns.sustain/Data/tmp/sustain-snapshots/*.png screens/ 2>/dev/null || true
          ls -la screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: screens/
          if-no-files-found: ignore
