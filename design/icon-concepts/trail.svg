<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Sustain: an S drawn in light that keeps going</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2622"/>
      <stop offset="1" stop-color="#0E0C0B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="light" gradientUnits="userSpaceOnUse" x1="660" y1="300" x2="360" y2="740">
      <stop offset="0" stop-color="#FFF1DC"/>
      <stop offset=".5" stop-color="#F7B98C"/>
      <stop offset="1" stop-color="#E8763F"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- glow built from wide, faint copies of the stroke -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M660 318 C590 270 404 284 400 398 C396 500 628 494 632 612 C636 728 446 748 362 690" stroke="#E8763F" stroke-opacity=".08" stroke-width="170"/>
    <path d="M660 318 C590 270 404 284 400 398 C396 500 628 494 632 612 C636 728 446 748 362 690" stroke="#E8763F" stroke-opacity=".16" stroke-width="112"/>
    <path d="M660 318 C590 270 404 284 400 398 C396 500 628 494 632 612 C636 728 446 748 362 690" stroke="url(#light)" stroke-width="54"/>
  </g>
</svg>
