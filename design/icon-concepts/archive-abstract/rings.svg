<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Sustain: growth rings, each one further out</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2622"/>
      <stop offset="1" stop-color="#0E0C0B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brass" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="840">
      <stop offset="0" stop-color="#F7DCA4"/>
      <stop offset=".5" stop-color="#D9A55E"/>
      <stop offset="1" stop-color="#95632A"/>
    </linearGradient>
    <radialGradient id="core" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFE6D8"/>
      <stop offset=".5" stop-color="#F29A7C"/>
      <stop offset="1" stop-color="#B9472C"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="224" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <!-- each ring grows a little off-center, like wood, and the gaps widen -->
  <g fill="none" stroke="url(#brass)">
    <ellipse cx="500" cy="530" rx="294" ry="282" stroke-width="12" transform="rotate(-8 500 530)"/>
    <ellipse cx="506" cy="526" rx="206" ry="198" stroke-width="14" transform="rotate(-6 506 526)"/>
    <ellipse cx="511" cy="522" rx="134" ry="130" stroke-width="16"/>
    <ellipse cx="515" cy="519" rx="78" ry="76" stroke-width="18"/>
  </g>
  <circle cx="518" cy="517" r="34" fill="url(#core)"/>
</svg>
